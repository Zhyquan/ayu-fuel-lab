                <div class="article_con article_con_title">
                    <div class=TRS_Editor><p align="justify">　　截至5月27日，国内成品油价格挂靠的国际市场原油前10个工作日平均价格低于每桶40美元。根据《石油价格管理办法》和《油价调控风险准备金征收管理办法》有关规定，本次汽、柴油价格不作调整，未调金额将全部纳入油价调控风险准备金，全额上缴中央国库。</p><p>　　</p><p align="justify">　　</p><p align="justify">　　</p></div>
