name: Update and deploy fuel references

on:
  schedule:
    # Asia/Shanghai: 01:17, 07:17, 13:17, 19:17.
    - cron: '17 5,11,17,23 * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Failure drill: simulate API HTTP 503; deployment must be skipped'
        type: boolean
        default: false
  push:
    branches: [main]
  workflow_run:
    workflows: [Intelligence V2 official daily forecast]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: fuel-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily-delivery:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'Zhyquan/ayu-fuel-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Verify this trusted Official Daily commit and fresh cache
        id: ready
        env:
          OFFICIAL_TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          OFFICIAL_TRIGGER_CREATED_AT: ${{ github.event.workflow_run.created_at }}
        run: node scripts/intelligence-v2/pages-delivery-ready.mjs
  build:
    needs: daily-delivery
    if: ${{ !cancelled() && (github.event_name != 'workflow_run' || needs.daily-delivery.outputs.ready == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Recheck daily identity after build checkout
        if: github.event_name == 'workflow_run'
        env:
          OFFICIAL_TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          OFFICIAL_TRIGGER_CREATED_AT: ${{ github.event.workflow_run.created_at }}
        run: |
          node scripts/intelligence-v2/pages-delivery-ready.mjs > daily-delivery-result.json
          node --input-type=module -e 'import fs from "node:fs"; if(JSON.parse(fs.readFileSync("daily-delivery-result.json")).ready!==true)process.exit(1);'
      - name: Public source scan
        run: npm run scan
      - name: Data contract regression
        run: npm test
      - name: Start fresh update
        id: start
        run: |
          rm -f dist/data/normalized-live-cache.json
          node --input-type=module -e 'import fs from "node:fs"; fs.appendFileSync(process.env.GITHUB_ENV, `RUN_STARTED_AT=${new Date().toISOString()}\n`);'
      - name: Fetch 31 provinces anonymously
        id: update
        env:
          SIMULATE_API_FAILURE: ${{ inputs.simulate_failure && '1' || '0' }}
        run: npm run update
      - name: PUBLIC_DATA_GATE
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: npm run gate
      - name: Scan generated public files
        run: npm run scan
      - name: Prepare Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload validated static site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
          retention-days: 1
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
