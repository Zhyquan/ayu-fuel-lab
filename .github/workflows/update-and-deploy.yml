name: Update and deploy fuel references

on:
  schedule:
    # Asia/Shanghai: 01:17, 07:17, 13:17, 19:17.
    - cron: '17 5,11,17,23 * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Failure drill: simulate API HTTP 503; deployment must be skipped'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fuel-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Public source scan
        run: npm run scan
      - name: Data contract regression
        run: npm test
      - name: Start fresh update
        id: start
        run: |
          rm -f dist/data/normalized-live-cache.json
          node --input-type=module -e 'import fs from "node:fs"; fs.appendFileSync(process.env.GITHUB_ENV, `RUN_STARTED_AT=${new Date().toISOString()}\n`);'
      - name: Fetch 31 provinces anonymously
        id: update
        env:
          SIMULATE_API_FAILURE: ${{ inputs.simulate_failure && '1' || '0' }}
        run: npm run update
      - name: PUBLIC_DATA_GATE
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: npm run gate
      - name: Scan generated public files
        run: npm run scan
      - name: Prepare Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload validated static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
